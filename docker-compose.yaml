  recsys-postgres:
    container_name: recsys-postgres
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${RECSYS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RECSYS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RECSYS_POSTGRES_DB}
    ports:
      - "5434:${RECSYS_POSTGRES_PORT}"
    volumes:
      - recsys_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U ${RECSYS_POSTGRES_USER} -d ${RECSYS_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3

  recsys-redis:
    container_name: recsys-redis
    image: redis:7-alpine
    command: redis-server --requirepass ${RECSYS_REDIS_PASSWORD}
    ports:
      - "6380:${RECSYS_REDIS_PORT}"
    volumes:
      - recsys_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-h", "localhost", "-a", "${RECSYS_REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: OFF
      ZOOKEEPER_LOG4J_LOGGERS: "org.apache.zookeeper=OFF,org.apache.kafka=OFF"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_secrets:/etc/zookeeper/secrets
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: none

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      # Replication (3 brokers)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

      # Retention (7 days storage)
      KAFKA_LOG_RETENTION_HOURS: 168

      # Auto create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Leader rebalancing
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300

    volumes:
      - kafka_1_data:/var/lib/kafka/data
      - kafka_1_secrets:/etc/kafka/secrets
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 3

  # Kafka Broker 2
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      # Replication (3 brokers)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

      # Retention (7 days)
      KAFKA_LOG_RETENTION_HOURS: 168

      # Auto create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Leader rebalancing
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300

    volumes:
      - kafka_2_data:/var/lib/kafka/data
      - kafka_2_secrets:/etc/kafka/secrets
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093" ]
      interval: 15s
      timeout: 10s
      retries: 3

  # Kafka Broker 3
  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      # Replication (3 brokers)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

      # Retention (7 days)
      KAFKA_LOG_RETENTION_HOURS: 168

      # Auto create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Leader rebalancing
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300

    volumes:
      - kafka_3_data:/var/lib/kafka/data
      - kafka_3_secrets:/etc/kafka/secrets
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094" ]
      interval: 15s
      timeout: 10s
      retries: 3

  clickhouse-rec-analytics:
    container_name: clickhouse-rec-analytics
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${REC_ANALYTICS_CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${REC_ANALYTICS_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${REC_ANALYTICS_CLICKHOUSE_PASSWORD}
    volumes:
      - analytics_clickhouse_data:/var/lib/clickhouse
      - analytics_clickhouse_logs:/var/log/clickhouse-server
      - ./recommendation-analytics/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  rec-analytics-consumer-1:
    container_name: rec-analytics-consumer-1
    build:
      context: ./recommendation-analytics
      dockerfile: Dockerfile
      target: consumer
    image: rec-analytics-consumer
    depends_on:
      clickhouse-rec-analytics:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9093,kafka-3:9094"
      CONSUMER_ID: "analytics-consumer-1"
    restart: unless-stopped

  rec-analytics-consumer-2:
    container_name: rec-analytics-consumer-2
    image: rec-analytics-consumer
    depends_on:
      clickhouse-rec-analytics:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9093,kafka-3:9094"
      CONSUMER_ID: "analytics-consumer-2"
    restart: unless-stopped

  rec-analytics-consumer-3:
    container_name: rec-analytics-consumer-3
    image: rec-analytics-consumer
    depends_on:
     clickhouse-rec-analytics:
          condition: service_healthy
     kafka-1:
       condition: service_healthy
     kafka-2:
       condition: service_healthy
     kafka-3:
       condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9093,kafka-3:9094"
      CONSUMER_ID: "analytics-consumer-3"
    restart: unless-stopped

  # docker compose exec -u root superset bash -c "/app/.venv/bin/python -m ensurepip && /app/.venv/bin/python -m pip install psycopg2-binary"
  # docker compose exec -u root superset bash -c "/app/.venv/bin/python -m pip install clickhouse-connect"
  superset:
    image: apache/superset:latest
    container_name: superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=aK9mP2xQvL7nRjT4wYhD6sFcE1bUoZ3g
      - SUPERSET_ADMIN_USERNAME=admin
      - SUPERSET_ADMIN_PASSWORD=admin
      - SUPERSET_ADMIN_EMAIL=admin@example.com
      - SUPERSET_ADMIN_FIRSTNAME=Admin
      - SUPERSET_ADMIN_LASTNAME=User
    volumes:
      - superset_home:/app/superset_home
    command: >
      bash -c "
        pip install psycopg2-binary && 
        superset db upgrade &&
        superset fab create-admin --username $$SUPERSET_ADMIN_USERNAME --firstname $$SUPERSET_ADMIN_FIRSTNAME --lastname $$SUPERSET_ADMIN_LASTNAME --email $$SUPERSET_ADMIN_EMAIL --password $$SUPERSET_ADMIN_PASSWORD &&
        superset init &&
        superset run -p 8088 -h 0.0.0.0
      "

  rec-analytics-migrations:
    container_name: rec-analytics-migrations
    build:
      context: ./recommendation-analytics
      dockerfile: Dockerfile
      target: migrations
    env_file:
      - .env
    depends_on:
      clickhouse-rec-analytics:
        condition: service_healthy
    restart: on-failure:3

volumes:
  backend_postgres_data:
  backend_redis_data:
  zookeeper_data:
  zookeeper_logs:
  zookeeper_secrets:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  kafka_1_secrets:
  kafka_2_secrets:
  kafka_3_secrets:
  recsys_postgres_data:
  recsys_redis_data:
