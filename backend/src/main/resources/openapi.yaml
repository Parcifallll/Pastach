openapi: 3.1.0
info:
  title: Pastach API
  description: API documentation for pet-project 'Pastach' - social networking website
  contact:
    name: Roman
    url: https://github.com/Parcifallll
    email: rspisanov@edu.hse.ru
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
externalDocs:
  description: GitHub repository
  url: https://github.com/Parcifallll/pastach
servers:
  - url: http://localhost:8080
    description: Testing
security:
  - bearerAuth: []
tags:
  - name: Admins' endpoints
    description: "Administration of user accounts: manage roles, lock/unlock accounts\
    \ and delete users. Accessible to admins only."
  - name: Authentication
    description: "User registration, login, token refresh and session management"
  - name: Comments
    description: "Manage comments: create, read, update, delete comments and react to\
    \ them"
  - name: Posts
    description: "Manage posts: create, read, update, delete posts and react to them"
  - name: Users
    description: "User profile management: view, update, delete user profiles and change\
    \ passwords"
paths:
  /api/users/{id}/password:
    put:
      tags:
        - Users
      summary: Change user password
      description: Changes the password for a user. Users can only change their own
        password. Requires the current password for verification.
      operationId: changePassword
      parameters:
        - name: id
          in: path
          description: User identifier
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeDTO"
        required: true
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error or incorrect current password
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: User cannot change another user's password
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Password changed successfully
  /api/posts/{postId}/reactions:
    put:
      tags:
        - Posts
      summary: React to a post
      description: "Add or remove a reaction (like/dislike) to a post. If the same\
        \ reaction already exists, it will be removed (toggle behavior)."
      operationId: reactToPost
      parameters:
        - name: postId
          in: path
          description: Post identifier to react to
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionCreateDTO"
        required: true
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid reaction type
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Reaction toggled successfully
  /api/posts/{postId}/comments/{commentId}/reactions:
    put:
      tags:
        - Comments
      summary: React to a comment
      description: "Add or remove a reaction (like/dislike) to a comment. If the same\
        \ reaction already exists, it will be removed (toggle behavior)."
      operationId: reactToComment
      parameters:
        - name: commentId
          in: path
          description: Comment identifier to react to
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: postId
          in: query
          description: ID of the post
          required: true
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionCreateDTO"
        required: true
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Comment not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid reaction type
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Reaction toggled successfully
  /api/posts:
    get:
      tags:
        - Posts
      summary: Get all posts
      description: Returns a paginated list of all posts sorted by creation date (newest
        first)
      operationId: getAllPosts
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 15
            minimum: 1
        - name: sort
          in: query
          description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
          required: false
          schema:
            type: array
            default:
              - "createdAt,DESC"
            items:
              type: string
      responses:
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Posts retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModel"
      security: []
    post:
      tags:
        - Posts
      summary: Create a new post
      description: Creates a new post with text and/or photo. At least one of them
        must be provided.
      operationId: createPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreateDTO"
        required: true
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error or no content provided
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: User is locked and cannot create posts
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Post successfully created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostResponseDTO"
  /api/posts/{postId}/comments:
    get:
      tags:
        - Comments
      summary: Get all comments for a post
      description: "Returns a paginated list of all comments for a specific post,\
        \ sorted by creation date (newest first)"
      operationId: getAllByPostId
      parameters:
        - name: postId
          in: path
          description: ID of the post
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: sort
          in: query
          description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
          required: false
          schema:
            type: array
            default:
              - "createdAt,DESC"
            items:
              type: string
      responses:
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Comments retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModel"
      security: []
    post:
      tags:
        - Comments
      summary: Create a comment
      description: Creates a new comment on a post with text and/or photo. At least
        one of them must be provided.
      operationId: create
      parameters:
        - name: postId
          in: path
          description: ID of the post to comment on
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateDTO"
        required: true
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error or no content provided
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: User is locked and cannot create comments
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Comment successfully created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommentResponseDTO"
  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account and returns JWT tokens for authentication
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupDTO"
        required: true
      responses:
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User with this username or email already exists
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error or invalid input data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: User successfully registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JwtResponse"
      security: []
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Issues a new access token using a valid refresh token
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "401":
          description: Invalid or expired refresh token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Token successfully refreshed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JwtResponse"
      security: []
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout from current session
      description: "Revokes the provided refresh token, logging out the user from\
        \ the current session"
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Successfully logged out
  /api/auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Logout from all sessions
      description: "Revokes all refresh tokens for the current user, logging out from\
        \ all devices"
      operationId: logoutAll
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Successfully logged out from all sessions
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates user and returns JWT tokens
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDTO"
        required: true
      responses:
        "401":
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Successfully authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JwtResponse"
      security: []
  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns the profile information of a user by their ID
      operationId: getById
      parameters:
        - name: id
          in: path
          description: User identifier
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: User found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
      security: []
    delete:
      tags:
        - Users
      summary: Delete user account
      description: Permanently deletes a user account. Only admins can perform this
        action.
      operationId: deleteById
      parameters:
        - name: id
          in: path
          description: User identifier to delete
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: Insufficient permissions (admin only)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: User account deleted successfully
    patch:
      tags:
        - Users
      summary: Update user profile
      description: Updates user profile information. Users can only update their own
        profile.
      operationId: update
      parameters:
        - name: id
          in: path
          description: User identifier to update
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateDTO"
        required: true
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: User cannot update another user's profile
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: User profile updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
  /api/posts/{postId}:
    delete:
      tags:
        - Posts
      summary: Delete a post
      description: Permanently deletes a post. Only the post author or admin can delete
        it.
      operationId: deleteById_1
      parameters:
        - name: postId
          in: path
          description: Post identifier to delete
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationResponse"
        "403":
          description: User is not the author or admin
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Post successfully deleted
    patch:
      tags:
        - Posts
      summary: Update a post
      description: Updates post content (text and/or photo). Only the post author
        can update it.
      operationId: updateById
      parameters:
        - name: postId
          in: path
          description: Post identifier to update
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateDTO"
        required: true
      responses:
        "401":
          description: User not authenticated
          content:
            '*/*':
              schema:
