components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ValidationResponse:
      type: object
      properties:
        type:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    PasswordChangeDTO:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
        - currentPassword
        - newPassword
    ReactionCreateDTO:
      type: object
      properties:
        type:
          type: string
          enum:
            - LIKE
            - DISLIKE
      required:
        - type
    PostCreateDTO:
      type: object
      properties:
        text:
          type: string
        photoUrl:
          type: string
    PostResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        text:
          type: string
        photoUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        commentsCount:
          type: integer
          format: int64
        likesCount:
          type: integer
          format: int64
        dislikesCount:
          type: integer
          format: int64
    CommentCreateDTO:
      type: object
      properties:
        text:
          type: string
        photoUrl:
          type: string
        parentCommentId:
          type: integer
          format: int64
    CommentResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        postId:
          type: integer
          format: int64
        photoUrl:
          type: string
        authorId:
          type: integer
          format: int64
        parentCommentId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        likesCount:
          type: integer
          format: int64
        dislikesCount:
          type: integer
          format: int64
    SignupDTO:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        birthday:
          type: string
          format: date
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
        - firstName
        - lastName
        - password
        - username
    JwtResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    LoginDTO:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 1
      required:
        - password
    UserUpdateDTO:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        birthday:
          type: string
          format: date
    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        birthday:
          type: string
          format: date
        locked:
          type: boolean
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
    PostUpdateDTO:
      type: object
      properties:
        text:
          type: string
        photoUrl:
          type: string
    CommentUpdateDTO:
      type: object
      properties:
        text:
          type: string
        photoUrl:
          type: string
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
    PagedModel:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            objectList:
              type: array
              items: {}
        _links:
          $ref: "#/components/schemas/Links"
        page:
          $ref: "#/components/schemas/PageMetadata"
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    SessionInfo:
      type: object
      properties:
        sessionId:
          type: string
        userId:
          type: integer
          format: int64
        deviceInfo:
          type: string
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
    Link:
      type: object
      properties:
        href:
          type: string
        hreflang:
          type: string
        title:
          type: string
        type:
          type: string
        deprecation:
          type: string
        profile:
          type: string
        name:
          type: string
        templated:
          type: boolean
    Links:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Link"
  securitySchemes:
    bearerAuth:
      type: http
      description: "JWT token. Get it from Authentication controller: /auth/login\
        \ or /auth/signup endpoints. "
      in: header
      scheme: bearer
      bearerFormat: JWT
